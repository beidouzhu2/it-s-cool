name: Build 25.12 openwrt-daede

on:
  schedule:
    - cron: '45 21 * * 0' # Monday morning, Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Clone makeself repository
        run: git clone https://github.com/megastep/makeself.git

      - name: Fetch latest prerelease info
        id: fetch_release
        run: |
          curl -s https://api.github.com/repos/kenzok8/openwrt-daede/releases \
            | jq 'map(select(.prerelease==false)) | sort_by(.published_at) | last' \
            > release.json


      - name: Parse asset download URLs
        id: parse_assets
        run: bash shell/parse_assets25.sh
         
      - name: Download apk files
        run: bash shell/download_apks.sh

      - name: Create install.sh scripts
        run: |
          cat <<EOF > x86/install.sh
          #!/bin/sh
          apk update
          if [ $? -ne 0 ]; then
              echo "update failed。"
              exit 1
          fi
          apk add --allow-untrusted *.apk
          EOF
          chmod +x x86/install.sh
          cp x86/install.sh arm64/install.sh
          cp x86/install.sh arm64-a53/install.sh

      - name: Move directories to makeself
        run: |
          mv x86 makeself/
          mv arm64 makeself/
          mv arm64-a53 makeself/

      - name: Create self-extracting packages
        run: |
          cd makeself
          ./makeself.sh x86/ 25-openwrt-daede-${VERSION}-x86_64.run "by github action" ./install.sh
          ./makeself.sh arm64/ 25-openwrt-daede-${VERSION}-aarch64_generic.run "by github action" ./install.sh
          ./makeself.sh arm64-a53/ 25-openwrt-daede-${VERSION}-aarch64_cortex-a53.run "by github action" ./install.sh

      - name: Check file sizes
        run: |
          ls -lh makeself/*.run

      - name: Preparing release name
        run: |
          release_name=$(TZ="Asia/Shanghai" date +'%Y-%m-%d %H:%M Build')
          echo "RELEASE_NAME=$release_name" >> $GITHUB_ENV


      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload test artifact
        if: github.ref_name != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: test-25-openwrt-daede
          path: makeself/*.run
          if-no-files-found: error
          retention-days: 7

      - name: Upload run files as release assets
        if: github.ref_name == 'daily'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openwrt25-${{ env.tag_name }}
          name: "OpenWrt 25.12 APK - ${{ env.tag_name }}"
          prerelease: true
          make_latest: false
          files: makeself/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "OpenWrt 25.12 (APK) only. Not for 24.10 / IPK. Upstream: wkccd/dailybuild."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
