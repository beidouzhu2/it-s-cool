name: Transfer Uninstall Run File

on:
  schedule:
    - cron: "0 22 * * *"  # UTC 22:00 = 北京时间 06:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  transfer:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Download run file
        run: |
          curl -L -o luci-app-uninstall.run https://plugin.vumstar.com/download/luci-app-uninstall.run

      - name: Extract makeself run file
        run: |
          mkdir unpack
          sh luci-app-uninstall.run --target unpack --keep > /dev/null 2>&1 || true
          # 确保 VERSION 存在
          if [ ! -f unpack/VERSION ]; then
            echo "VERSION file missing!"
            exit 1
          fi

      - name: Read Version
        id: version
        run: |
          VERSION=$(cat unpack/VERSION | tr -d '\n' | tr -d ' ')
          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          mv luci-app-uninstall.run luci-app-uninstall-v${VERSION}.run
 
      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload test artifact
        if: github.ref_name != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: test-advance_uninstall
          path: |
            luci-app-uninstall*.run
          if-no-files-found: error
          retention-days: 7

      - name: Upload run files as release assets
        if: github.ref_name == 'daily'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.tag_name }}
          name: "Daily Build - ${{ env.tag_name }}"
          files: |
            luci-app-uninstall*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
             <p align="left">
              <img src="https://img.shields.io/github/downloads/beidouzhu2/it-s-cool/${{ env.tag_name }}/total?style=for-the-badge&label=%E4%BB%8A%E6%97%A5%E4%B8%8B%E8%BD%BD%E6%AC%A1%E6%95%B0&labelColor=427e25&color=black"/>
              <a href="https://wkdaily.cpolar.cn/archives/1">
                <img src="https://img.shields.io/badge/可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
              </a>
             </p>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
