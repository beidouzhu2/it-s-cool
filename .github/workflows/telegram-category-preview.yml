name: One-time categorized Telegram preview
on:
  push:
    branches:
      - 'test/telegram-category-preview'
    paths:
      - '.github/workflows/telegram-category-preview.yml'
permissions:
  contents: read
jobs:
  preview:
    if: github.ref_name == 'test/telegram-category-preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Send current categorized release links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scripts/weekly_push.py
