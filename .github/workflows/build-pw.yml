name: Build 25.12 PassWall

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build_passwall_2512:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v6

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y makeself curl wget

      - name: 赋予脚本执行权限
        run: chmod +x shell/pw25.sh

      - name: 执行打包脚本
        run: ./shell/pw25.sh --all

      #- name: 上传 Artifacts（每个架构的 APK）
        #uses: actions/upload-artifact@v7
        #with:
          #name: passwall-apks
          #path: dist/passwall-run/apks/
          #retention-days: 7

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV

      - name: Upload test artifact
        if: github.ref_name != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: test-build-pw
          path: dist/passwall-run/run/*.run
          if-no-files-found: error
          retention-days: 7

      - name: Upload run files as release assets
        if: github.ref_name == 'daily'
        uses: softprops/action-gh-release@v3
        with:
          files: dist/passwall-run/run/*.run
          tag_name: openwrt25-${{ env.tag_name }}
          name: "OpenWrt 25.12 APK - ${{ env.tag_name }}"
          prerelease: true
          make_latest: false
          draft: false
          overwrite_files: true
          body: "OpenWrt 25.12 (APK) only. Upstream: wkccd/dailybuild."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
