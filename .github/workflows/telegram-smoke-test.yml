name: One-time Telegram download test

on:
  push:
    branches:
      - 'test/dailybuild-migration'
    paths:
      - '.github/workflows/telegram-smoke-test.yml'

permissions:
  contents: read

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    if: github.ref_name == 'test/dailybuild-migration'
    steps:
      - name: 提取 Release 链接并推送 Telegram
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python3 - <<'PY'
          import datetime, html, json, os, urllib.request, urllib.parse, urllib.error
          from zoneinfo import ZoneInfo
          tag = "2026-11-25"
          req = urllib.request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/releases/tags/{tag}",
              headers={"Accept": "application/vnd.github+json", "User-Agent": "Bleki-build"})
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  assets = json.load(response).get("assets", [])
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("No release for today"); raise SystemExit(0)
              raise
          if not assets:
              print("No assets for today"); raise SystemExit(0)
          sample = next((a for a in assets if a["name"] == "openclash-x86-64-v0.48.002.run"), None)
          if not sample:
              raise SystemExit("Expected sample missing")
          with urllib.request.urlopen(sample["browser_download_url"], timeout=90) as response:
              size = 0
              while block := response.read(1024 * 1024):
                  size += len(block)
          if size != sample["size"]:
              raise SystemExit("Sample download size mismatch")
          print(f"Verified sample download: {sample['name']} ({size} bytes)")
          header = f"🧪 <b>Bleki 插件推送测试</b>\n请点击以下真实 Release 链接测试下载（现有正式版文件，非新构建）。\n<b>日期：</b> {tag}\n\n"
          chunks, chunk = [], header
          for asset in assets:
              name = asset["name"]
              if not name.endswith(".run"):
                  continue
              low = name.lower()
              label = next((t for t in ("passwall2","passwall","openclash","adguardhome","ssrp","ssrplus") if t in low), name)
              arch = next((v for k,v in (("aarch32","Arm32"),("armv7","Arm32"),("aarch64","Arm64"),("arm64","Arm64"),("x86","x86")) if k in low), "")
              line = f"♦️ <b>{html.escape(label)}插件{(' ('+arch+'架构)') if arch else ''}：</b>\n{html.escape(asset['browser_download_url'])}\n\n"
              if len((chunk + line).encode("utf-16-le")) // 2 > 3800:
                  chunks.append(chunk); chunk = header
              chunk += line
          if chunk != header:
              chunks.append(chunk)
          for msg in chunks:
              data = urllib.parse.urlencode({"chat_id": os.environ["TG_CHAT_ID"], "text": msg, "parse_mode": "HTML", "disable_web_page_preview": "true"}).encode()
              try:
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TG_BOT_TOKEN']}/sendMessage", data=data, timeout=30) as response:
                      result = json.load(response)
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit("Telegram request failed")
              if not result.get("ok"):
                  raise SystemExit("Telegram rejected message")
          print(f"Sent {len(chunks)} message(s)")
          PY
