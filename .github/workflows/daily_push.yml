name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 【核心策略：回归纯净换行】
            # 我们不再用 sed 替换 %0A，直接利用 jq 输出真实换行
            # 并通过 EOF 方式安全地把多行文本存入环境变量
            echo "found=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            
            {
              echo "content<<EOF"
              echo "$RESPONSE" | jq -r '
                .assets[] | 
                .name as $n | .browser_download_url as $u |
                (if $n | contains("passwall2") then "passwall2"
                 elif $n | contains("passwall") then "passwall"
                 elif $n | contains("openclash") then "openclash"
                 elif $n | contains("AdGuardHome") then "AdGuardHome"
                 elif $n | contains("ssrp") then "ssrp"
                 elif $n | contains("ssrplus") then "ssrplus"
                 else $n end) as $t |
                "🔹 \($t)插件：\n\n\($u)\n"
              '
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 构造最终消息
          # 这里的回车是真实的换行，不再有 %0A
          TEXT="📦 *GitHub 插件每日更新*
          📅 *日期：* ${{ steps.get_data.outputs.tag }}
          
          ${{ steps.get_data.outputs.content }}"
          
          # 发送时使用 --data-urlencode，它会自动把真实换行转义成电报需要的格式
          # 这样链接结尾就是干净的，不会再出现 404
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
