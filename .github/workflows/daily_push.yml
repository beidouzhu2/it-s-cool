name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取并推送
        id: process
        run: |
          # 1. 获取日期
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          # 2. 获取数据
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          
          # 3. 检查是否存在
          if echo "$RESPONSE" | grep -q "Not Found"; then
             echo "found=false" >> $GITHUB_OUTPUT
          else
             # 4. 只用 jq 提取原始的 "文件名|链接" 列表，不进行任何处理
             RAW_LIST=$(echo "$RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)"')
             
             # 5. 在 shell 中循环处理
             FINAL_TEXT=""
             while IFS='|' read -r filename url; do
               # 提取第一个横杠前的名字 (例如 openclash-v1 -> openclash)
               # 如果没有横杠，则保留原名
               PLUGIN_NAME=${filename%%-*}
               
               # 构造消息：标题加粗，换行，链接，再换行
               # 这里用 \n，稍后统一转为 %0A
               ITEM="*${PLUGIN_NAME}插件：*\n${url}\n\n"
               FINAL_TEXT="${FINAL_TEXT}${ITEM}"
             done <<< "$RAW_LIST"
             
             # 6. 使用你之前成功的 sed 转换逻辑
             FORMATTED_CONTENT=$(echo -e "$FINAL_TEXT" | sed ':a;N;$!ba;s/\n/%0A/g')
             
             echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
             echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
             echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.process.outputs.found == 'true'
        run: |
          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.process.outputs.tag }}%0A%0A${{ steps.process.outputs.content }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

      - name: 错误提醒
        if: steps.process.outputs.found == 'false'
        run: |
          ERROR_MSG="⚠️ *通知* %0A未能在仓库中找到日期为 $(TZ='Asia/Shanghai' date +'%Y-%m-%d') 的 Release。"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$ERROR_MSG" \
            -d "parse_mode=Markdown"
