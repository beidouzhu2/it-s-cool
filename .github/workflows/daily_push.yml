name: 每周分类推送插件下载链接

on:
  schedule:
    - cron: '5 1 * * 1'
  workflow_dispatch:
  push:
    branches:
      - 'test/full-weekly-push'
    paths:
      - '.github/workflows/daily_push.yml'
      - 'scripts/weekly_push.py'
  pull_request:
    branches:
      - daily
    paths:
      - '.github/workflows/daily_push.yml'
      - 'scripts/weekly_push.py'

permissions:
  contents: read

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test categorization and real release lookup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/weekly_push.py --self-test
          python3 scripts/weekly_push.py --dry-run
  fetch_and_push:
    if: github.ref_name == 'daily' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 分类推送 Release 安装包链接
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python3 scripts/weekly_push.py
