name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 继续使用你那个能成功的 jq 原始拼接逻辑，不做逻辑改动，只改符号
            # 我们给标题套上 * (加粗)，并多加一个 \n 确保物理隔离
            FORMATTED_CONTENT=$(echo "$RESPONSE" | jq -r '.assets[] | "*🔹 \(.name):*\n\n\(.browser_download_url)\n"' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 拿回原始数据
          RAW_CONTENT="${{ steps.get_data.outputs.content }}"
          
          # 【精准美容手术】
          # 1. 匹配 passwall/openclash/AdGuardHome/ssrp/ssrplus 等关键词
          # 2. 将它们统一格式化为 "名字插件："
          # 3. 这里的 sed 逻辑不影响消息发送，只会美化文字
          CLEAN_CONTENT=$(echo "$RAW_CONTENT" | \
            sed -E 's/AdGuardHome[^:]*/AdGuardHome插件/g' | \
            sed -E 's/openclash[^:]*/openclash插件/g' | \
            sed -E 's/passwall2[^:]*/passwall2插件/g' | \
            sed -E 's/passwall[^2:][^:]*/passwall插件/g' | \
            sed -E 's/ssrplus[^:]*/ssrplus插件/g' | \
            sed -E 's/ssrp[^:]*/ssrp插件/g')

          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A$CLEAN_CONTENT"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
