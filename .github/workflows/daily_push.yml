name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 运行提取并直接发送
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          # 1. 获取北京时间日期
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          # 2. 获取 Release 原始数据
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          
          # 3. 检查 Release 是否存在
          if echo "$RESPONSE" | grep -q "Not Found"; then
            echo "未找到今日 Release"
            TEXT="⚠️ *通知* %0A未能在仓库中找到日期为 $TAG_DATE 的 Release。"
          else
            # 4. 提取文件名和链接，并循环处理
            # 这里的逻辑：提取横杠前的全名，标题和链接分行确保无链接属性
            RAW_LIST=$(echo "$RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)"')
            
            # 初始化消息头部
            CONTENT="📦 *GitHub 插件每日更新* %0A📅 *日期：* $TAG_DATE %0A%0A"
            
            while IFS='|' read -r filename url; do
              # 提取第一个横杠前的名字
              PLUGIN_NAME=${filename%%-*}
              # 拼接：加粗标题 + 换行 + 链接 + 换行
              ITEM="*${PLUGIN_NAME}插件：*%0A${url}%0A%0A"
              CONTENT="${CONTENT}${ITEM}"
            done <<< "$RAW_LIST"
            TEXT="$CONTENT"
          fi

          # 5. 重点：使用 --data-urlencode 直接发送，不经过 GITHUB_OUTPUT 传递
          curl -s -X POST "https://api.telegram.org/bot$TG_BOT_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT_ID" \
            --data-urlencode "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
