name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 修改这里的逻辑：
            # 1. 提取文件名后，通过 shell 处理成你想要的“xx插件”格式
            # 2. 将标题和链接完全分开
            
            # 使用 jq 提取文件名和链接，中间用特殊符号 | 分隔
            RAW_LIST=$(echo "$RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)"')
            
            FORMATTED_CONTENT=""
            while IFS='|' read -r filename url; do
              # 提取插件主名称（例如从 ssrpx8664-xxx 提取 ssrp）
              # 这里假设前四个字母是插件名，你也可以根据需要修改
              PLUGIN_NAME=$(echo "$filename" | cut -c 1-4)
              
              # 组合成：ssrp插件：(换行) 链接 (换行)
              ITEM="${PLUGIN_NAME}插件：%0A${url}%0A"
              FORMATTED_CONTENT="${FORMATTED_CONTENT}${ITEM}%0A"
            done <<< "$RAW_LIST"
            
            echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 发送消息
          # 注意：parse_mode 使用 HTML 模式可以更精准控制，或者继续用 Markdown
          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A${{ steps.get_data.outputs.content }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
