name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 使用 jq 的 if-elif 逻辑进行多关键词判断
            # 只要包含关键词，就统一命名格式，并加 \n 强制分行断开链接属性
            FORMATTED_CONTENT=$(echo "$RESPONSE" | jq -r '
              .assets[] | 
              (if .name | contains("passwall") then "passwall"
               elif .name | contains("openclash") then "openclash"
               elif .name | contains("ssrplus") then "ssrplus"
               elif .name | contains("adguardhome") then "AdGuardHome"
               elif .name | contains("mosdns") then "mosdns"
               elif .name | contains("smartdns") then "smartdns"
               elif .name | contains("v2ray") then "v2ray"
               elif .name | contains("clash") then "clash"
               else .name end) as $name |
              "*\($name)插件：*\n\(.browser_download_url)\n"
            ' | sed ':a;N;$!ba;s/\n/%0A/g')
            
            echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A${{ steps.get_data.outputs.content }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

      - name: 错误提醒
        if: steps.get_data.outputs.found == 'false'
        run: |
          ERROR_MSG="⚠️ *通知* %0A未能在仓库中找到日期为 $(TZ='Asia/Shanghai' date +'%Y-%m-%d') 的 Release。"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$ERROR_MSG" \
            -d "parse_mode=Markdown"
