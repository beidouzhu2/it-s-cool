name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          # 1. 完全保留你原本成功的代码逻辑
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 这一行不做任何改动，确保数据能 100% 传到下一步
            FORMATTED_CONTENT=$(echo "$RESPONSE" | jq -r '.assets[] | "🔹 \(.name):\n\(.browser_download_url)\n"' | sed ':a;N;$!ba;s/\n/%0A/g')
            
            echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 2. 在这里处理：把标题名弄全，并断开链接属性
          # 我们把 "🔹 名字-版本号:" 替换成 "*名字插件：*%0A"
          # 注意：sed 的正则使用了最基础的写法，防止报错
          RAW_CONTENT="${{ steps.get_data.outputs.content }}"
          
          # 处理逻辑：
          # s/🔹%20//g -> 去掉小方块
          # s/-[^%]*%3A/插件：*%0A/g -> 把横杠到冒号的内容换成 插件：并强制换行(%0A)
          CLEAN_CONTENT=$(echo "$RAW_CONTENT" | sed 's/🔹%20//g' | sed 's/-[^%]*%3A/插件：*%0A/g')

          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A$CLEAN_CONTENT"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"

      - name: 错误提醒
        if: steps.get_data.outputs.found == 'false'
        run: |
          ERROR_MSG="⚠️ *通知* %0A未能在仓库中找到日期为 $(TZ='Asia/Shanghai' date +'%Y-%m-%d') 的 Release。"
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$ERROR_MSG" \
            -d "parse_mode=Markdown"
