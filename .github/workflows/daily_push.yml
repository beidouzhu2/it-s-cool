name: 每日提取插件下载链接

on:
  schedule:
    # 每天北京时间 08:05 自动运行 (UTC 00:05)
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      # --- 下面就是你刚才问的那段代码放置的位置 ---
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          # 强制北京时间
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          # 获取数据
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "今日尚未发布 $TAG_DATE 的版本。"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            # 1. 提取原始列表 (文件名|下载地址)
            RAW_LIST=$(echo "$RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)"')
            
            FORMATTED_CONTENT=""
            # 2. 循环处理每一个附件
            while IFS='|' read -r filename url; do
              # 截取第一个横杠 '-' 之前的内容作为插件名
              if [[ $filename == *"-"* ]]; then
                PLUGIN_NAME=$(echo "$filename" | cut -d'-' -f1)
              else
                PLUGIN_NAME=$filename
              fi
              
              # 3. 构造每行格式：标题 + 换行 + 链接
              ITEM="*${PLUGIN_NAME}插件：*%0A${url}%0A"
              FORMATTED_CONTENT="${FORMATTED_CONTENT}${ITEM}%0A"
            done <<< "$RAW_LIST"
            
            echo "content=$FORMATTED_CONTENT" >> $GITHUB_OUTPUT
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 发送最终整合后的消息
          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A${{ steps.get_data.outputs.content }}"
          
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TG_CHAT_ID }}" \
            -d "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
