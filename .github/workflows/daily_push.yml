name: 每日提取插件下载链接

on:
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch: 

jobs:
  fetch_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: 提取 Release 链接与标题
        id: get_data
        run: |
          TAG_DATE=$(TZ='Asia/Shanghai' date +'%Y-%m-%d')
          REPO="beidouzhu2/it-s-cool"
          
          RESPONSE=$(curl -s "https://api.github.com/repos/$REPO/releases/tags/$TAG_DATE")
          CHECK_EXIST=$(echo "$RESPONSE" | jq -r '.message // empty')
          
          if [ "$CHECK_EXIST" == "Not Found" ]; then
            echo "今日尚未发布 $TAG_DATE 的版本。"
            echo "found=false" >> $GITHUB_OUTPUT
          else
            RAW_LIST=$(echo "$RESPONSE" | jq -r '.assets[] | "\(.name)|\(.browser_download_url)"')
            
            # 使用一个临时变量存储内容
            TEMP_CONTENT=""
            while IFS='|' read -r filename url; do
              if [[ $filename == *"-"* ]]; then
                PLUGIN_NAME=$(echo "$filename" | cut -d'-' -f1)
              else
                PLUGIN_NAME=$filename
              fi
              # 这里的 %0A 是为了给后续 curl 请求使用的换行符
              ITEM="*${PLUGIN_NAME}插件：*%0A${url}%0A"
              TEMP_CONTENT="${TEMP_CONTENT}${ITEM}%0A"
            done <<< "$RAW_LIST"

            # --- 核心修复：使用 EOF 方式写入多行变量，防止截断 ---
            echo "tag=$TAG_DATE" >> $GITHUB_OUTPUT
            echo "found=true" >> $GITHUB_OUTPUT
            echo "content<<EOF" >> $GITHUB_OUTPUT
            echo "$TEMP_CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: 推送到 Telegram
        if: steps.get_data.outputs.found == 'true'
        run: |
          # 构造最终消息体
          # 注意：这里不再需要手动加 %0A，因为上面变量里已经带了编码后的换行
          TEXT="📦 *GitHub 插件每日更新* %0A📅 *日期：* ${{ steps.get_data.outputs.tag }}%0A%0A${{ steps.get_data.outputs.content }}"
          
          # 使用 --data-urlencode 确保长文本安全传输
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TG_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TG_CHAT_ID }}" \
            --data-urlencode "text=$TEXT" \
            -d "parse_mode=Markdown" \
            -d "disable_web_page_preview=true"
