name: Build 25.12 Argon

on:
  schedule:
    - cron: '10 21 * * 0' # Monday morning, Beijing time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 安装 makeself 工具
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 🚀 下载argon所有apk
        run: |
          chmod +x shell/argon25.sh
          ./shell/argon25.sh

      - name: 📋 拷贝 install25.sh 到各平台目录
        run: |
          cp shell/install25.sh x86_64/install25.sh
          cp shell/install25.sh aarch64_generic/install25.sh
          chmod +x x86_64/install25.sh aarch64_generic/install25.sh

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          # 获取版本
          FILE=$(basename x86_64/luci-theme-argon-*.apk)
          VERSION=$(echo "$FILE" | sed -E 's/^luci-theme-argon-([0-9.]+)-r.*$/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

          if [ -z "$VERSION" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 打包两个平台
          for PLATFORM in x86_64 aarch64_generic aarch64_cortex-a53; do
            makeself "$PLATFORM" "output/25-argon-${VERSION}_${PLATFORM}.run" \
              "argon ${PLATFORM} Installer v${VERSION}" ./install25.sh
          done

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload test artifact
        if: github.ref_name != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: test-argon25
          path: output/*.run
          if-no-files-found: error
          retention-days: 7

      - name: Upload run files as release assets
        if: github.ref_name == 'daily'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openwrt25-${{ env.tag_name }}
          name: "OpenWrt 25.12 APK - ${{ env.tag_name }}"
          prerelease: true
          make_latest: false
          files: output/*.run
          body: "OpenWrt 25.12 (APK) only. Not for 24.10 / IPK. Upstream: wkccd/dailybuild."
          token: ${{ secrets.GITHUB_TOKEN }}
