name: Build 25.12 iStore

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make-run:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 安装 makeself 工具
        run: sudo apt-get update && sudo apt-get install -y makeself curl

      - name: 🚀 下载 luci-app-store 的所有 apk
        run: |
          chmod +x shell/store25.sh
          ./shell/store25.sh

      - name: 📋 拷贝 install25.sh 到 store 文件夹
        run: |
          cp shell/install25.sh store/install25.sh
          chmod +x store/install25.sh

      - name: 🔍 提取版本号并打包
        id: pack
        run: |
          mkdir -p output

          # 获取 luci-app-store 的 apk 文件
          STORE_APK=$(find store -maxdepth 1 -name 'luci-app-store-*.apk' | head -n1)
          FILE=$(basename "$STORE_APK")
          VERSION=${FILE#luci-app-store-}
          VERSION=${VERSION%.apk}

          if [ -z "$VERSION" ]; then
            echo "❌ 无法提取版本号"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # 打包成 .run
          makeself store "output/25-luci-app-store-${VERSION}_all.run" \
            "iStore Installer v${VERSION}" ./install25.sh

      - name: Set tag name
        id: vars
        run: |
          TODAY=$(date -u -d '+8 hour' +'%Y-%m-%d')
          echo "tag_name=$TODAY" >> $GITHUB_ENV
          
      - name: Upload test artifact
        if: github.ref_name != 'daily'
        uses: actions/upload-artifact@v4
        with:
          name: test-store25
          path: output/*.run
          if-no-files-found: error
          retention-days: 7

      - name: Upload run files as release assets
        if: github.ref_name == 'daily'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: openwrt25-${{ env.tag_name }}
          name: "OpenWrt 25.12 APK - ${{ env.tag_name }}"
          prerelease: true
          make_latest: false
          files: output/*.run
          token: ${{ secrets.GITHUB_TOKEN }}
          body: "OpenWrt 25.12 (APK) only. Not for 24.10 / IPK. Upstream: wkccd/dailybuild."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
